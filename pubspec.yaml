name: workout_ai_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase core (upgraded to satisfy firebase_ai ^3.13.1) ──
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  firebase_ai: ^3.13.1

  # ── Existing dependencies (unchanged) ──
  video_player: ^2.9.0
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+1
  camera_android: ^0.10.10+16
  google_mlkit_pose_detection: ^0.14.1
  permission_handler: ^12.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pushup.gif
    - assets/squat.gif
    - assets/Male_Front_Model.png
    - assets/Male_Back_Model.png
    - assets/Female_Front_Model.png
    - assets/Female_Back_Model.png